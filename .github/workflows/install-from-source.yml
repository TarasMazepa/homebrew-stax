name: install-from-source.yml

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  install-from-source:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: |
          brew install --build-from-source TarasMazepa/stax/stax
          stax help
          stax doctor
          stax version

  install-from-source-linux-arm64v8:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@v4
      - run: docker run -d -i --platform linux/arm64/v8 arm64v8/alpine:latest
        env:
          HOMEBREW_DEVELOPER: true

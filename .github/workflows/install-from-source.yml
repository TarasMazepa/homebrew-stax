name: install-from-source.yml

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  install-from-source:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: |
          brew install --build-from-source ./Formula/stax.rb
          stax help
          stax doctor
          stax version
        env:
          HOMEBREW_DEVELOPER: true


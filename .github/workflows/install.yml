name: install.yml

on:
  push:
    branches: [ "main" ]

jobs:
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: |
          brew install TarasMazepa/stax/stax
          stax help
          stax doctor

